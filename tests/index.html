<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes App - Test Suite</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px auto; max-width: 800px; line-height: 1.6; color: #1e293b; background: #f8fafc; }
    h1 { margin-bottom: 8px; }
    .test-summary { margin-bottom: 24px; padding: 12px 16px; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 1rem; }
    .summary-pass { color: #10b981; font-weight: bold; }
    .summary-fail { color: #ef4444; font-weight: bold; margin-left: 8px; }
    .test-suite { background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 20px; margin-bottom: 20px; }
    .test-suite h3 { margin-top: 0; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
    .test-list { list-style: none; padding: 0; margin: 0; }
    .test-item { padding: 8px 0; border-bottom: 1px solid #f8fafc; display: flex; flex-direction: column; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-right: 8px; }
    .badge.pass { background: #dcfce7; color: #15803d; }
    .badge.fail { background: #fee2e2; color: #b91c1c; }
    .error-trace { background: #fee2e2; color: #991b1b; padding: 8px; border-radius: 4px; font-size: 0.8rem; margin-top: 6px; white-space: pre-wrap; }
    a { color: #3b82f6; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Unit Test Suite</h1>
  <p><a href="../index.html">&larr; Return to Notes App</a></p>
  <div id="test-summary" class="test-summary">Running tests...</div>
  <div id="test-results"></div>

  <script type="module">
    import { TestRunner } from './test-runner.js';
    import { registerNoteTests } from './note.test.js';
    import { registerMarkdownTests } from './markdown.test.js';

    const runner = new TestRunner();
    registerNoteTests(runner);
    registerMarkdownTests(runner);
    runner.run();
  </script>
</body>
</html>
